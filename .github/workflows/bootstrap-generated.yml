name: Bootstrap generated artifacts

on:
  push:
    branches:
      - chatgpt/oauth-provider/2026-09-18/17-01-km01

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Better Auth schema
        run: npm run generate:auth-schema

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Worker bundle
        run: npm run validate:worker

      - name: Upload generated files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: krosa-maja-generated
          path: |
            package-lock.json
            migrations/0001-better-auth.sql
          if-no-files-found: error
          retention-days: 1
