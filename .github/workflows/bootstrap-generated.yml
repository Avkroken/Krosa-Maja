name: Bootstrap generated artifacts

on:
  push:
    branches:
      - chatgpt/oauth-provider/2026-09-18/17-01-km01

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Better Auth schema
        run: npm run generate:auth-schema

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Worker bundle
        run: npm run validate:worker

      - name: Commit exact generated artifacts and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json migrations/0001-better-auth.sql
          git rm .github/workflows/bootstrap-generated.yml
          git commit -m "build: add generated lockfile and auth schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
