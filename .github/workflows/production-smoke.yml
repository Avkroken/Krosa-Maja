name: Production smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krosa-maja-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify production OIDC and Access boundaries
        env:
          BASE_URL: https://auth.denied.se
          SMOKE_INITIAL_DELAY_MS: "30000"
          SMOKE_ATTEMPTS: "12"
          SMOKE_RETRY_DELAY_MS: "10000"
        run: node scripts/smoke-production.mjs
