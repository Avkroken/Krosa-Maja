name: Edge diagnostic

on:
  push:
    branches:
      - chatgpt/edge-diagnostic/2026-09-19/07-28-km05

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe Cloudflare challenge behavior
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"
            ua="$2"
            echo "=== $label ==="
            curl -sS -o "/tmp/$label.body" -D "/tmp/$label.headers" \
              --max-time 20 \
              -H "User-Agent: $ua" \
              -H "Accept: application/json" \
              https://auth.denied.se/health || true
            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "/tmp/$label.headers")"
            echo "status=$status"
            grep -Ei '^(server|cf-ray|cf-mitigated|content-type|location):' "/tmp/$label.headers" || true
            head -c 120 "/tmp/$label.body" | tr '\n' ' '
            echo
          }
          probe machine 'krosa-maja-production-smoke/1'
          probe browser 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
      - name: Check Cloudflare API credential availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "cloudflare_api_token_present=false"
            exit 0
          fi
          echo "cloudflare_api_token_present=true"
          if [ -n "${CF_ACCOUNT_ID:-}" ]; then
            echo "cloudflare_account_id_present=true"
          else
            echo "cloudflare_account_id_present=false"
          fi
          verify="$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          VERIFY_JSON="$verify" node -e '
            const x=JSON.parse(process.env.VERIFY_JSON);
            console.log("token_verify_success="+String(Boolean(x.success)));
            if (!x.success) console.log("token_verify_error_codes="+(x.errors||[]).map(e=>e.code).join(","));
          '
          zones="$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=denied.se&status=active&per_page=1")"
          ZONES_JSON="$zones" node -e '
            const x=JSON.parse(process.env.ZONES_JSON);
            console.log("zone_lookup_success="+String(Boolean(x.success)));
            console.log("zone_lookup_count="+String(Array.isArray(x.result)?x.result.length:0));
            if (!x.success) console.log("zone_lookup_error_codes="+(x.errors||[]).map(e=>e.code).join(","));
          '
