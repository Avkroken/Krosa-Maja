name: Cloudflare API probe

on:
  push:
    branches:
      - chatgpt/cloudflare-api-probe/2026-09-19/07-35-km08

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify org Cloudflare context
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${CF_ACCOUNT_ID:-}" ]; then
            echo "account_id_present=true"
            echo "account_id_length=${#CF_ACCOUNT_ID}"
          else
            echo "account_id_present=false"
          fi

          if [ -n "${CF_TOKEN:-}" ]; then
            echo "api_token_present=true"
          else
            echo "api_token_present=false"
            exit 0
          fi

          verify="$(curl -sS --max-time 20             -H "Authorization: Bearer $CF_TOKEN"             https://api.cloudflare.com/client/v4/user/tokens/verify)"
          VERIFY_JSON="$verify" node -e '
            const x=JSON.parse(process.env.VERIFY_JSON);
            console.log("token_verify_success="+String(Boolean(x.success)));
            if (!x.success) console.log("token_verify_error_codes="+(x.errors||[]).map(e=>e.code).join(","));
          '

          if [ -n "${CF_ACCOUNT_ID:-}" ]; then
            acct="$(curl -sS --max-time 20               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID")"
            ACCOUNT_JSON="$acct" node -e '
              const x=JSON.parse(process.env.ACCOUNT_JSON);
              console.log("account_read_success="+String(Boolean(x.success)));
              if (!x.success) console.log("account_read_error_codes="+(x.errors||[]).map(e=>e.code).join(","));
            '
          fi

          zones="$(curl -sS --max-time 20             -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/zones?name=denied.se&status=active&per_page=1")"
          ZONES_JSON="$zones" node -e '
            const x=JSON.parse(process.env.ZONES_JSON);
            console.log("zone_lookup_success="+String(Boolean(x.success)));
            console.log("zone_lookup_count="+String(Array.isArray(x.result)?x.result.length:0));
            if (!x.success) console.log("zone_lookup_error_codes="+(x.errors||[]).map(e=>e.code).join(","));
          '
