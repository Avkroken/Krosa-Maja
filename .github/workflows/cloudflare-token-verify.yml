name: Cloudflare token verify

on:
  push:
    branches:
      - chatgpt/cloudflare-token-verify/2026-09-19/08-12-km10

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect Bot Fight Mode upgrade path
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCOUNT_ID:-}" || exit 1
          test -n "${CF_TOKEN:-}" || exit 1

          zones="$(curl -sS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=denied.se&status=active&per_page=1")"
          ZONES_JSON="$zones" node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(process.env.ZONES_JSON);
          if(!x.success || !Array.isArray(x.result) || x.result.length!==1) process.exit(1);
          const z=x.result[0];
          fs.writeFileSync("/tmp/zone-id",z.id);
          console.log("plan_name="+String(z.plan?.name ?? "<unknown>"));
          console.log("plan_legacy_id="+String(z.plan?.legacy_id ?? "<unknown>"));
          NODE
          ZONE_ID="$(cat /tmp/zone-id)"

          bot="$(curl -sS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/bot_management")"
          BOT_JSON="$bot" node - <<'NODE'
          const x=JSON.parse(process.env.BOT_JSON);
          if(!x.success) {
            console.log("bot_read_success=false");
            console.log(JSON.stringify(x.errors||[]));
            process.exit(1);
          }
          const r=x.result||{};
          const safe={
            fight_mode:r.fight_mode,
            sbfm_definitely_automated:r.sbfm_definitely_automated,
            sbfm_likely_automated:r.sbfm_likely_automated,
            sbfm_verified_bots:r.sbfm_verified_bots,
            sbfm_static_resource_protection:r.sbfm_static_resource_protection,
            optimize_wordpress:r.optimize_wordpress,
            stale_zone_configuration:r.stale_zone_configuration
          };
          console.log("bot_read_success=true");
          console.log(JSON.stringify(safe,null,2));
          NODE
